[package]
name = "httpsd"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "a dead simple 2-argument https proxy"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
chrono = "0.4"
dirs = "5"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "native-tokio", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
if-addrs = "0.15"
rcgen = { version = "0.13", features = ["pem"] }
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
